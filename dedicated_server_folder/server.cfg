# Vegga Project 7 - Dedicated Server Configuration
# ================================================

# Server Name (shows in server browser)
hostname "Vegga Project 7 - Dev Server"

# Server Password (private server)
sv_password "vegga123"

# Max Players
maxplayers 16

# The gamemode/addon to run (your project ident)
# Format: org.project or just project name
gamemode "original.my_project_7"

# Map to load on start
map "testscenevegga"

# RCON password for remote admin (optional)
# rcon_password "richard123"

# Server region (for matchmaking)
# sv_region 0

# Enable/disable features
sv_cheats 0
sv_lan 0

# Logging
log on

